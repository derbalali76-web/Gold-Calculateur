name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      # Calculation engine (pure Kotlin) + app unit tests (input parsing, ad policy, billing logic, runner)
      - name: Unit tests
        run: ./gradlew :engine:test :app:testDebugUnitTest --stacktrace

      # Debug build always uses Google's TEST ad units.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            engine/build/reports/tests/
            app/build/reports/tests/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-calculateur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
