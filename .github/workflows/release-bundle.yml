name: Release bundle (manual, signed)

# Builds the signed AAB for Google Play. All secrets live in GitHub "Actions secrets" (never in the repo):
#   RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD,
#   ADMOB_APP_ID, ADMOB_BANNER_UNIT_ID, ADMOB_INTERSTITIAL_UNIT_ID,
#   PRIVACY_POLICY_URL, TERMS_URL, CONTACT_EMAIL
# The build refuses to run with AdMob test ids or missing values (see verifyReleaseConfig in app/build.gradle.kts).

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Restore upload keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Test and bundle
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
          PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
          TERMS_URL: ${{ secrets.TERMS_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: ./gradlew :engine:test :app:testDebugUnitTest :app:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gold-calculateur-release-aab
          path: app/build/outputs/bundle/release/*.aab
