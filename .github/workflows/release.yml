name: Release - signed AAB + APK (manual)

# ONE release workflow. Always signs with the permanent key stored in repository secrets
# (RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD), created once by
# 'Create signing key (run once)'. versionCode = this workflow's run number, so every new build installs
# over the previous one. The build is blocked by Gradle (verifyReleaseConfig) with Google test ad ids.

on:
  workflow_dispatch:
  push:
    paths: ['.release-trigger']   # committing this file starts a release build

permissions:
  contents: write   # to publish the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAVE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      SECRET_STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
      SECRET_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      SECRET_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Prepare signing key (the ONE permanent key from repository secrets)
        run: |
          if [ "$HAVE_KEYSTORE" != "true" ]; then
            echo "::error::No permanent signing key yet. Run the workflow 'Create signing key (run once)' first. Builds signed with a different key cannot update an installed app."
            exit 1
          fi
          if [ -z "$SECRET_STORE_PASS" ] || [ -z "$SECRET_KEY_ALIAS" ] || [ -z "$SECRET_KEY_PASS" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is set but RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "STORE_PASS=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$SECRET_KEY_PASS" >> "$GITHUB_ENV"

      - name: Test and build (release guard blocks test ad ids)
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          VERSION_CODE: ${{ github.run_number }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
          ADMOB_REWARDED_UNIT_ID: ${{ secrets.ADMOB_REWARDED_UNIT_ID }}
          ADMOB_APP_OPEN_UNIT_ID: ${{ secrets.ADMOB_APP_OPEN_UNIT_ID }}
          PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
          TERMS_URL: ${{ secrets.TERMS_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          export RELEASE_STORE_PASSWORD="$STORE_PASS" RELEASE_KEY_ALIAS="$KEY_ALIAS" RELEASE_KEY_PASSWORD="$KEY_PASS"
          ./gradlew :engine:test :app:testDebugUnitTest :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify the AAB is signed
        run: jarsigner -verify "$(ls app/build/outputs/bundle/release/*.aab)" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: gold-calculateur-release-aab
          path: app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: gold-calculateur-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (APK + AAB)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          TAG="v1.0.${VERSION_CODE}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          cp "$APK" "Gold-Calculateur-$TAG.apk"
          cp "$AAB" "Gold-Calculateur-$TAG.aab"
          gh release create "$TAG" "Gold-Calculateur-$TAG.apk" "Gold-Calculateur-$TAG.aab" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Gold Calculateur $TAG" \
            --notes "Signed with the permanent key. Installs over the previous version. APK = direct install, AAB = Google Play."
