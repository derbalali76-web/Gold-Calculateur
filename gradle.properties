# ---------------------------------------------------------------------------
# Release configuration (leave EMPTY in git; supply via ~/.gradle/gradle.properties
# or environment variables ORG_GRADLE_PROJECT_<NAME>). NEVER commit real secrets.
# Debug builds always use Google's public TEST ad units, whatever is set here.
# AdMob ids are public identifiers (they ship inside the APK), so they are committed as defaults.
# Release builds FAIL if signing is missing or test ids are used. Privacy/terms/contact only warn.
# ---------------------------------------------------------------------------
